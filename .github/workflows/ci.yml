name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para a varredura de segredos

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Secret scan (gitleaks) - Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --verbose .

      - name: Secret scan (gitleaks) - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/gitleaks_${env:GITLEAKS_VERSION}_windows_x64.zip" -OutFile gitleaks.zip
          Expand-Archive gitleaks.zip -DestinationPath gitleaks-bin
          & .\gitleaks-bin\gitleaks.exe git --no-banner --redact --verbose .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
